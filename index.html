<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GalleraPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #111827; }

    /* REGLAS DE IMPRESIÓN EXTREMAS */
    #printable-programming { display: none; }

    @media print {
      @page { size: A4 landscape; margin: 5mm; }
      
      html, body { background: white !important; color: black !important; margin: 0; padding: 0; }
      
      #root, .no-print { display: none !important; }

      #printable-programming { 
        display: block !important; 
        width: 100% !important;
      }

      .report-title { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 0; }
      .report-subtitle { text-align: center; font-size: 10pt; margin-bottom: 10px; border-bottom: 1px solid black; }

      table { width: 100%; border-collapse: collapse; border: 1.5px solid black; table-layout: fixed; }
      
      th, td { 
        border: 1px solid black !important; 
        padding: 2px 1px; 
        text-align: center; 
        font-size: 7.5pt; 
        overflow: hidden;
      }

      th { background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; font-weight: bold; }
      
      .vs-cell { background-color: #000 !important; color: white !important; -webkit-print-color-adjust: exact; width: 25px; }
      
      .cuerda-name { font-weight: bold; text-align: left; padding-left: 3px; font-size: 8pt; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
